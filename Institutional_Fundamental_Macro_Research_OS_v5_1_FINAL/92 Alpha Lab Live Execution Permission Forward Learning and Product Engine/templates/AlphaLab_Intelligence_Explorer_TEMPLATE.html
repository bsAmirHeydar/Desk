<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alpha Desk · Research Explorer</title>
<!-- Canonical UX3 template: data model is embedded once; the view renders a Command Center, one Market Workspace, compact Lens Index, one Deep-Dive Drawer and one Scenario Canvas. -->
<style>
:root{--bg:#efe9de;--paper:#fffdf8;--ink:#171512;--muted:#746d63;--line:#d8cdbc;--gold:#987438;--dark:#11110f;--focus:#b58b43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.9}.skip{position:absolute;inset-inline-start:-9999px}.skip:focus{inset-inline-start:12px;top:12px;background:#fff;padding:8px;z-index:99}.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;direction:ltr}.rail{direction:rtl;background:var(--dark);color:#eee8dc;padding:20px 14px}.main{direction:rtl}.top{position:sticky;top:0;background:#f8f4eced;border-bottom:1px solid var(--line);padding:12px 18px;z-index:10}.content{max-width:1280px;margin:auto;padding:24px}.command{padding:26px 0;border-bottom:1px solid var(--line)}.market-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.workspace{padding:32px 0}.lens-row{display:grid;grid-template-columns:220px 120px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.scenario-tabs{display:flex;gap:6px;overflow:auto}.scenario-canvas{border-top:1px solid var(--line);margin-top:10px;padding-top:16px}.drawer{position:fixed;inset:0 0 0 auto;width:min(720px,94vw);background:var(--paper);transform:translateX(105%);transition:transform .15s;z-index:30;overflow:auto}.drawer[data-open="true"]{transform:none}.drawer-backdrop{position:fixed;inset:0;background:#0008;display:none;z-index:29}.drawer-backdrop[data-open="true"]{display:block}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}@media(max-width:900px){.app{display:block}.rail{display:none}.market-strip{display:flex;overflow:auto}.market-strip>*{min-width:220px}.lens-row{grid-template-columns:1fr}.drawer{inset:auto 0 0 0;width:100%;height:92vh;transform:translateY(105%)}.drawer[data-open="true"]{transform:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">رفتن به محتوای اصلی</a>
<div class="app">
<aside class="rail" aria-label="ناوبری بازارها">{{MARKET_RAIL}}</aside>
<main class="main" id="main">
<header class="top">{{AS_OF_AND_MOBILE_NAV}}</header>
<div class="content">
<section class="command">{{COMMAND_CENTER}}</section>
<section class="workspace">{{SELECTED_MARKET_WORKSPACE}}{{KNOW_INTERPRET_UNKNOWN}}{{LENS_INDEX}}{{SCENARIO_NAVIGATOR}}</section>
<section>{{THINKING_GUIDE}}{{PHILOSOPHY_FRAGILITY}}{{EVIDENCE}}{{QUALITY_LIMITATIONS}}</section>
</div>
</main>
</div>
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="deep-drawer" aria-hidden="true">{{SINGLE_DEEP_DIVE_DRAWER}}</aside>
<script type="application/json" id="public-report-data">{{SANITIZED_PUBLIC_REPORT_DATA}}</script>
<script>{{UX3_RENDERER_JS}}</script>
</body></html>
