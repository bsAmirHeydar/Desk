function matrix(){return `<div class="matrix">${DB.symbols.map(s=>{let m=DB.markets[s];return `<div class="matrix-row"><div class="m-symbol">${s}</div>${m.horizons.map(h=>`<div class="mcell"><div class="l">${h.label}</div><div class="d ${clsDirection(h.direction)}">${h.direction}</div></div>`).join('')}</div>`}).join('')}</div>`}
function overview(){let r=DB.run;$('#content').innerHTML=`<section class="hero"><div class="eyebrow">ALPHA LAB · FULL‑VAULT RUN</div><h2>شش بازار، یک رژیم مشترک اما شش عدم‌تقارن مستقل</h2><p>${r.theme}</p><div class="hero-stats"><div class="stat"><div class="k">Cutoff تهران</div><div class="v">۱۱:۲۹</div></div><div class="stat"><div class="k">کاتالیزور اصلی</div><div class="v">NFP · ۱۶:۰۰</div></div><div class="stat"><div class="k">نیروی مشترک</div><div class="v">نرخ + دلار + نفت</div></div><div class="stat"><div class="k">Permission فعال</div><div class="v">۰ از ۶</div></div></div></section><section class="section"><div class="section-head"><div><h3>شش بازار</h3><p>Direction و Edge عمداً از هم جدا هستند.</p></div></div><div class="grid">${DB.symbols.map(card).join('')}</div></section><section class="section"><div class="section-head"><div><h3>ماتریس افق‌ها</h3><p>اختلاف افق‌ها به‌جای صاف‌شدن، آشکار نگه داشته شده است.</p></div></div>${matrix()}</section>`;bindOpen()}
function markets(){let counts={};DB.symbols.forEach(s=>counts[DB.markets[s].edge]=(counts[DB.markets[s].edge]||0)+1);$('#content').innerHTML=`<section class="section"><div class="section-head"><div><h3>بازارها و سطح فرصت</h3><p>Edge فعال تنها حالتی است که به BUY/SELL تبدیل می‌شود.</p></div></div><div class="grid">${DB.symbols.map(card).join('')}</div></section><section class="section"><div class="card"><h3 style="margin-top:0">منطق سطوح Edge</h3><div class="kv"><div class="k">Edge فعال</div><div>عدم‌تقارن جهت‌دار قابل استفاده؛ تنها سطح دارای Permission.</div></div><div class="kv"><div class="k">Edge مشروط</div><div>عدم‌تقارن هست ولی trigger/confirmation یا رفع veto لازم است.</div></div><div class="kv"><div class="k">Edge نسبی</div><div>برتری/ضعف نسبت به بازار دیگر، نه الزاماً trade مطلق تک‌نمادی.</div></div><div class="kv"><div class="k">فقط Bias</div><div>جهت دفاع‌پذیر است ولی کیفیت فرصت برای Permission کافی نیست.</div></div><div class="kv"><div class="k">بدون Edge</div><div>نیروها متعادل یا asymmetry ناکافی است.</div></div></div></section>`;bindOpen()}
function market(){let m=DB.markets[state.market];let html=`<section class="market-hero"><div class="market-title"><div><div class="ticker">${state.market}</div><h2>${m.name}</h2></div><div class="summary">${m.dominant_narrative}</div></div><div class="decision"><div><div class="k">جهت فعلی</div><div class="v ${clsDirection(m.current)}">${m.current}</div></div><div><div class="k">روزانه</div><div class="v ${clsDirection(m.daily)}">${m.daily}</div></div><div><div class="k">اعتماد</div><div class="v">${m.confidence}/100</div></div><div><div class="k">وضعیت فرصت</div><div class="v">${m.edge_label}</div></div><div><div class="k">مجوز اجرا</div><div class="v latin">${m.permission}</div></div><div><div class="k">بررسی بعدی</div><div class="v">${m.next_review_tehran}</div></div></div><div class="rationale"><strong>چرا این سطح؟</strong> ${m.edge_reason}<br><strong>ارتقا:</strong> ${m.upgrade}<br><strong>تنزل:</strong> ${m.downgrade}</div><div class="tabs"><button class="${state.tab==='summary'?'active':''}" data-tab="summary">خلاصه</button><button class="${state.tab==='full'?'active':''}" data-tab="full">تحلیل کامل</button><button class="${state.tab==='sources'?'active':''}" data-tab="sources">منابع</button></div></section>`;
if(state.tab==='summary'){html+=`<div class="deep-grid"><section class="panel"><h4>تصویر تصمیم</h4><div class="kv"><div class="k">قیمت/Anchor</div><div>${m.price_anchor}</div></div><div class="kv"><div class="k">Driver فعال</div><div>${m.active_driver}</div></div><div class="kv"><div class="k">نیروی مخالف</div><div>${m.opposing}</div></div><div class="kv"><div class="k">Transmission</div><div>${m.transmission}</div></div></section><section class="panel"><h4>کیفیت فرصت</h4><div class="kv"><div class="k">Consumption</div><div>${m.consumption}</div></div><div class="kv"><div class="k">Remaining Pressure</div><div>${m.remaining}</div></div><div class="kv"><div class="k">Stability</div><div>${m.stability}</div></div><div class="kv"><div class="k">Reversal Risk</div><div>${m.reversal}</div></div><div class="kv"><div class="k">Narrative dominance</div><div>${m.narrative_dominance}</div></div></section></div><section class="section panel"><h4>شش افق</h4><div class="horizon-list">${m.horizons.map(h=>`<div class="hitem"><div class="topline"><strong>${h.label}</strong><span class="${clsDirection(h.direction)}">${h.direction}</span></div><div>اعتماد: ${h.confidence}/100 · ${h.driver}</div><div class="why">${h.note}</div></div>`).join('')}</div></section>`}
if(state.tab==='full'){html+=`<div class="deep-grid"><section class="panel"><h4>Fact / Force / Driver</h4><div class="kv"><div class="k">Active Driver</div><div>${m.active_driver}</div></div><div class="kv"><div class="k">Opposing Force</div><div>${m.opposing}</div></div><div class="kv"><div class="k">Transmission</div><div>${m.transmission}</div></div><div class="kv"><div class="k">Attention</div><div>${m.attention}</div></div></section><section class="panel"><h4>روایت و چرخه عمر</h4><div class="kv"><div class="k">روایت غالب</div><div>${m.dominant_narrative}</div></div><div class="kv"><div class="k">رقیب</div><div>${m.challenger}</div></div><div class="kv"><div class="k">Validity</div><div>${m.validity}</div></div><div class="kv"><div class="k">Dominance</div><div>${m.narrative_dominance}</div></div><div class="kv"><div class="k">Saturation</div><div>${m.saturation}</div></div><div class="kv"><div class="k">Transition</div><div>${m.transition}</div></div></section><section class="panel"><h4>مصرف، فشار، پایداری</h4><div class="kv"><div class="k">Consumption</div><div>${m.consumption}</div></div><div class="kv"><div class="k">Remaining Pressure</div><div>${m.remaining}</div></div><div class="kv"><div class="k">Fact Persistence</div><div>${m.persistence_fact}</div></div><div class="kv"><div class="k">Narrative Persistence</div><div>${m.persistence_narrative}</div></div><div class="kv"><div class="k">Verdict Stability</div><div>${m.stability}</div></div><div class="kv"><div class="k">Reversal Risk</div><div>${m.reversal}</div></div></section><section class="panel"><h4>مسیر قیمت و درس قبلی</h4><p>${m.price_anchor}</p><p>${m.prior_lesson}</p></section><section class="panel"><h4>سناریوها</h4><div class="scenario"><strong>Base:</strong> ${m.scenarios.base}</div><div class="scenario"><strong>Bull:</strong> ${m.scenarios.bull}</div><div class="scenario"><strong>Bear:</strong> ${m.scenarios.bear}</div><div class="scenario"><strong>No Edge:</strong> ${m.scenarios.noedge}</div></section><section class="panel"><h4>ابطال و بازبینی</h4><div class="kv"><div class="k">Invalidation</div><div>${m.invalidation}</div></div><div class="kv"><div class="k">Next Review</div><div>${m.next_review_tehran}</div></div><div class="kv"><div class="k">Early Trigger</div><div>${m.early}</div></div><div class="kv"><div class="k">محدودیت مشترک</div><div>${DB.run.data_limits}</div></div></section></div><section class="section panel"><h4>شش افق</h4><div class="horizon-list">${m.horizons.map(h=>`<div class="hitem"><div class="topline"><strong>${h.label}</strong><span class="${clsDirection(h.direction)}">${h.direction}</span></div><div>اعتماد: ${h.confidence}/100 · Driver: ${h.driver}</div><div class="why">${h.note}</div></div>`).join('')}</div></section>`}
if(state.tab==='sources'){html+=sourceList()}
$('#content').innerHTML=html;$$('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;setRoute(`market/${state.market}/${state.tab}`)})}
function sourceList(){return `<section class="section"><div class="section-head"><div><h3>منابع</h3><p>منابع عمومی اصلی این ران؛ داده‌های غیرقابل مشاهده جعل نشده‌اند.</p></div></div>${DB.sources.map(s=>`<div class="source"><div>${s.publisher} · ${s.date}</div><div class="title">${s.title}</div><a href="${s.url}" target="_blank" rel="noopener">${s.url}</a></div>`).join('')}</section>`}
function sources(){ $('#content').innerHTML=sourceList() }
function compare(){let A=DB.markets[state.a],B=DB.markets[state.b];$('#content').innerHTML=`<section class="section"><div class="section-head"><div><h3>مقایسه</h3><p>جهت و Edge را جداگانه کنار هم ببین.</p></div></div><div class="toolbar"><select id="sa" class="btn">${DB.symbols.map(s=>`<option ${s===state.a?'selected':''}>${s}</option>`).join('')}</select><select id="sb" class="btn">${DB.symbols.map(s=>`<option ${s===state.b?'selected':''}>${s}</option>`).join('')}</select></div><div class="compare section"><div class="card"><div class="sym">${state.a}</div><div class="name">${A.name}</div><div class="kv"><div class="k">Direction</div><div>${A.current}</div></div><div class="kv"><div class="k">Edge</div><div>${A.edge_label}</div></div><div class="kv"><div class="k">Permission</div><div class="latin">${A.permission}</div></div><div class="kv"><div class="k">Consumption</div><div>${A.consumption}</div></div><div class="kv"><div class="k">Pressure</div><div>${A.remaining}</div></div><div class="kv"><div class="k">Reversal</div><div>${A.reversal}</div></div><div class="rationale">${A.edge_reason}</div></div><div class="card"><div class="sym">${state.b}</div><div class="name">${B.name}</div><div class="kv"><div class="k">Direction</div><div>${B.current}</div></div><div class="kv"><div class="k">Edge</div><div>${B.edge_label}</div></div><div class="kv"><div class="k">Permission</div><div class="latin">${B.permission}</div></div><div class="kv"><div class="k">Consumption</div><div>${B.consumption}</div></div><div class="kv"><div class="k">Pressure</div><div>${B.remaining}</div></div><div class="kv"><div class="k">Reversal</div><div>${B.reversal}</div></div><div class="rationale">${B.edge_reason}</div></div></div></section>`;$('#sa').onchange=e=>{state.a=e.target.value;compare()};$('#sb').onchange=e=>{state.b=e.target.value;compare()}}
function bindOpen(){$$('[data-open]').forEach(x=>x.onclick=()=>setRoute(`market/${x.dataset.open}/summary`))}
function render(){parse();nav();$('#side').classList.remove('open');if(state.route==='overview'){overview();$('#crumb').textContent='نمای کلی'}else if(state.route==='markets'){markets();$('#crumb').textContent='بازارها'}else if(state.route==='compare'){compare();$('#crumb').textContent='مقایسه'}else if(state.route==='sources'){sources();$('#crumb').textContent='منابع'}else if(state.route==='market'){market();$('#crumb').textContent=`${state.market} / ${state.tab==='summary'?'خلاصه':state.tab==='full'?'تحلیل کامل':'منابع'}` }else setRoute('overview')}
window.addEventListener('hashchange',render);$('#menu').onclick=()=>$('#side').classList.toggle('open');render();
</script></body></html>
